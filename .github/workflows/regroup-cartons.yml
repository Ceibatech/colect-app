name: Regrouper les cartons par libellé (Contabo)

# Lancement manuel uniquement. « simulation » n'écrit rien : elle affiche le
# résumé et publie le rapport CSV des regroupements ; « appliquer » sauvegarde
# la base puis rattache les dossiers de même libellé (même salle) au plus
# ancien CTN du groupe (voir deploy/regroup-cartons.mjs).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "simulation (aucune écriture) ou appliquer"
        required: true
        default: simulation
        type: choice
        options: [simulation, appliquer]
      confirmation:
        description: "Pour appliquer, saisir exactement REGROUPER-CARTONS"
        required: false
        default: ""
        type: string
      seuil:
        description: "Nombre de dossiers au-delà duquel un libellé est jugé générique et n'est pas regroupé"
        required: true
        default: "80"
        type: string

permissions:
  contents: read

concurrency:
  group: contabo-regroup-cartons
  cancel-in-progress: false

jobs:
  regroup:
    name: Regroupement des cartons (${{ inputs.mode }})
    if: vars.CONTABO_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Exécuter sur le VPS en SSH vérifié
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SEUIL: ${{ inputs.seuil }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
          CONTABO_PORT: ${{ vars.CONTABO_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          [[ "$MODE" == simulation || "$MODE" == appliquer ]] || { echo "Mode invalide." >&2; exit 1; }
          if [[ "$MODE" == appliquer ]]; then
            [[ "$CONFIRMATION" == REGROUPER-CARTONS ]] || { echo "Confirmation absente ou incorrecte : saisir REGROUPER-CARTONS." >&2; exit 1; }
          else
            CONFIRMATION=none
          fi
          [[ "$SEUIL" =~ ^[0-9]{1,5}$ && "$SEUIL" -ge 2 ]] || { echo "Seuil invalide." >&2; exit 1; }
          [[ "$CONTABO_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "CONTABO_HOST invalide." >&2; exit 1; }
          [[ "$CONTABO_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "CONTABO_USER invalide." >&2; exit 1; }
          [[ "$CONTABO_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "CONTABO_PORT invalide." >&2; exit 1; }
          [[ -n "$CONTABO_SSH_KEY" && -n "$CONTABO_KNOWN_HOSTS" ]] || { echo "Secrets SSH requis." >&2; exit 1; }

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/colect-regroup.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$CONTABO_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset CONTABO_SSH_KEY CONTABO_KNOWN_HOSTS

          mkdir -p rapport
          ssh -F /dev/null -i "$ssh_dir/key" -p "$CONTABO_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$CONTABO_USER@$CONTABO_HOST" bash -s -- "$MODE" "$CONFIRMATION" "$SEUIL" > rapport/regroupement-cartons.csv <<'REMOTE'
          set -euo pipefail
          mode="$1"
          confirmation="$2"
          seuil="$3"
          script=/opt/colect-app/current/deploy/regroup-cartons.sh
          test -f "$script" || { echo "La release en service ne contient pas encore le script de regroupement." >&2; exit 1; }
          if [[ "$mode" == appliquer ]]; then
            bash "$script" appliquer "$confirmation" "$seuil" >&2
          else
            bash "$script" simulation "$seuil"
          fi
          REMOTE

      - name: Publier le rapport de simulation (conservé 7 jours)
        if: inputs.mode == 'simulation'
        uses: actions/upload-artifact@v4
        with:
          name: regroupement-cartons
          path: rapport/regroupement-cartons.csv
          retention-days: 7
          if-no-files-found: error
