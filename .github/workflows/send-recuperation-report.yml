name: Envoyer le rapport des boîtes à récupérer (Contabo)

# Lancement manuel. Extrait les premières boîtes du site Plateau (lecture
# seule), produit le tableur, le rapport PDF et les planches d'étiquettes
# (deploy/recuperation/build_recuperation.py), puis les envoie par e-mail avec
# le service d'envoi de l'application. « apercu » produit seulement les
# fichiers (artefact) sans rien envoyer.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apercu (fichiers seulement) ou envoyer"
        required: true
        default: apercu
        type: choice
        options: [apercu, envoyer]
      destinataires:
        description: "Destinataires, séparés par des virgules"
        required: true
        default: "md@ceiba-analytics.com"
        type: string
      copie:
        description: "Copie, séparée par des virgules"
        required: false
        default: "daf@ceiba-analytics.com,dac03@ceiba-analytics.com,dac01@ceiba-analytics.com,dac@ceiba-analytics.com"
        type: string
      boites:
        description: "Nombre de boîtes"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

concurrency:
  group: contabo-send-recuperation
  cancel-in-progress: false

jobs:
  report:
    name: Rapport des boîtes à récupérer (${{ inputs.mode }})
    if: vars.CONTABO_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer, produire et envoyer
        env:
          MODE: ${{ inputs.mode }}
          TO: ${{ inputs.destinataires }}
          CC: ${{ inputs.copie }}
          BOITES: ${{ inputs.boites }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
          CONTABO_PORT: ${{ vars.CONTABO_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$MODE" == apercu || "$MODE" == envoyer ]] || { echo "Mode invalide." >&2; exit 1; }
          [[ "$BOITES" =~ ^[0-9]{1,4}$ ]] || { echo "Nombre de boîtes invalide." >&2; exit 1; }
          [[ "$TO" =~ ^[A-Za-z0-9._%+@,\ -]{3,600}$ && "$CC" =~ ^[A-Za-z0-9._%+@,\ -]{0,600}$ ]] || { echo "Adresses invalides." >&2; exit 1; }
          TO="${TO// /}"; CC="${CC// /}"
          [[ "$CONTABO_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "CONTABO_HOST invalide." >&2; exit 1; }
          [[ "$CONTABO_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "CONTABO_USER invalide." >&2; exit 1; }
          [[ "$CONTABO_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "CONTABO_PORT invalide." >&2; exit 1; }
          [[ -n "$CONTABO_SSH_KEY" && -n "$CONTABO_KNOWN_HOSTS" ]] || { echo "Secrets SSH requis." >&2; exit 1; }

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/colect-report.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$CONTABO_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset CONTABO_SSH_KEY CONTABO_KNOWN_HOSTS
          ssh_options=(-F /dev/null -i "$ssh_dir/key" -p "$CONTABO_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          destination="$CONTABO_USER@$CONTABO_HOST"

          # 1. Extraction en lecture seule (marge pour écarter les libellés génériques).
          mkdir -p export rapport
          ssh "${ssh_options[@]}" "$destination" "bash /opt/colect-app/current/deploy/export-recuperation.sh $(( BOITES * 2 + 100 ))" > export/boites.json

          # 2. Tableur, rapport et étiquettes.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet reportlab==4.2.5 openpyxl==3.1.5
          "$RUNNER_TEMP/venv/bin/python" -I deploy/recuperation/build_recuperation.py export/boites.json rapport "$BOITES"
          rm -f export/boites.json

          # 3. Envoi depuis le serveur, avec la configuration e-mail de l'application.
          if [[ "$MODE" == envoyer ]]; then
            id="$GITHUB_RUN_ID"
            ssh "${ssh_options[@]}" "$destination" "umask 022; mkdir -p /opt/colect-app/shared/outbox/$id"
            for file in rapport/*.xlsx rapport/*.pdf rapport/summary.json; do
              ssh "${ssh_options[@]}" "$destination" "umask 022; set -C; cat > '/opt/colect-app/shared/outbox/$id/$(basename "$file")'" < "$file"
            done
            ssh "${ssh_options[@]}" "$destination" "bash /opt/colect-app/current/deploy/send-report-email.sh $id '$TO' '$CC'"
          fi

      - name: Conserver les fichiers produits (3 jours)
        uses: actions/upload-artifact@v4
        with:
          name: boites-a-recuperer
          path: rapport/
          retention-days: 3
          if-no-files-found: error
