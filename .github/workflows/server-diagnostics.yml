name: Diagnostic du serveur (Contabo, lecture seule)

# Lancement manuel. N'écrit rien : espace disque, taille et nombre des
# sauvegardes (base et documents), conteneurs. Sert à comprendre un échec
# de déploiement (« Database backup failed »).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic
    if: vars.CONTABO_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Lire l'état du serveur
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
          CONTABO_PORT: ${{ vars.CONTABO_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$CONTABO_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "CONTABO_HOST invalide." >&2; exit 1; }
          [[ "$CONTABO_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "CONTABO_USER invalide." >&2; exit 1; }
          [[ "$CONTABO_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "CONTABO_PORT invalide." >&2; exit 1; }
          [[ -n "$CONTABO_SSH_KEY" && -n "$CONTABO_KNOWN_HOSTS" ]] || { echo "Secrets SSH requis." >&2; exit 1; }

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/colect-report.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$CONTABO_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset CONTABO_SSH_KEY CONTABO_KNOWN_HOSTS
          ssh_options=(-F /dev/null -i "$ssh_dir/key" -p "$CONTABO_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          destination="$CONTABO_USER@$CONTABO_HOST"

          ssh "${ssh_options[@]}" "$destination" 'bash -s' <<'REMOTE'
          set -u
          shared=/opt/colect-app/shared
          echo "== Espace disque"; df -h / /opt /var/lib/docker 2>/dev/null | sort -u
          echo "== Sauvegardes de la base"; du -sh "$shared/db-backups" 2>/dev/null; ls -1 "$shared/db-backups" 2>/dev/null | wc -l; ls -lt "$shared/db-backups" 2>/dev/null | head -5
          echo "== Sauvegardes des documents"; du -sh "$shared/document-backups" 2>/dev/null; ls -1 "$shared/document-backups" 2>/dev/null | wc -l; ls -lt "$shared/document-backups" 2>/dev/null | head -5
          echo "== Droits des dossiers de sauvegarde"; ls -ld "$shared" "$shared/db-backups" "$shared/document-backups" 2>&1; stat -c '%n uid=%u gid=%g %A' "$shared/db-backups" "$shared/document-backups" 2>&1
          echo "== Essai d'écriture (uid 1000, comme le conteneur)"; for d in db-backups document-backups; do docker run --rm --user 1000:1000 -v "$shared/$d:/b" busybox sh -c 'touch /b/.essai && rm /b/.essai && echo "'$d' : écriture OK"' 2>&1 | tail -1; done
          echo "== Base de données"; docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep -iE "maria|mysql|db" 2>/dev/null | head -5
          echo "== Essai de dump (lecture seule, sortie jetée)"
          docker exec colect-app-app-1 node --input-type=module -e '
            import { spawn } from "node:child_process";
            import { dumpConnection } from "/app/deploy/backup-database.mjs";
            const { args, password } = dumpConnection(process.env.DATABASE_URL);
            const child = spawn("mariadb-dump", args, { stdio: ["ignore", "ignore", "pipe"], env: { PATH: process.env.PATH, LANG: "C.UTF-8", MYSQL_PWD: password } });
            let err = ""; child.stderr.on("data", (c) => { if (err.length < 3000) err += c; });
            child.on("error", (e) => console.log("mariadb-dump introuvable :", e.code));
            child.on("close", (code, signal) => { console.log("code", code, signal ?? "", "|", err.split(password).join("***").replace(/\s+/g, " ").trim()); });
          ' 2>&1 | tail -3
          echo "== Fichiers partiels"; find "$shared/db-backups" "$shared/document-backups" -name '*.partial' 2>/dev/null | head
          echo "== Releases"; du -sh /opt/colect-app/releases 2>/dev/null; ls -1 /opt/colect-app/releases 2>/dev/null | wc -l
          echo "== Docker"; docker system df 2>/dev/null || true
          echo "== Conteneurs"; docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null | head -12
          echo "== Inodes"; df -i / 2>/dev/null | tail -1
          REMOTE
